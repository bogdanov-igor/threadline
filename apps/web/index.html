<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Запасной файл первым: браузер с поддержкой SVG берёт последний подходящий. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Цвет окна установленного приложения: lib/theme.ts ставит фон выбранной темы. Ссылку на манифест сборка добавляет сама. -->
    <meta name="theme-color" content="#ffffff" />
    <title>Threadline</title>
    <!-- Шрифт с первой отрисовки: без подмены шрифта текст не переносится заново и ничего не сдвигается. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource-variable/inter/files/inter-cyrillic-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-cyrillic-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-cyrillic-500-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
