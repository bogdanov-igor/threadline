# Настройка Threadline для быстрого старта: Loki из compose.yaml рядом и демо-проект Demo Pay, README.ru.md, «Быстрый старт».
# compose.yaml монтирует файл в контейнер как config/quickstart.yaml: логотипы и справочник берутся из config/ образа.
# После правки: docker compose restart threadline. Формат файла: config/README.md.

# Вход выключен: у каждого запроса права администратора. Только для своей машины: compose.yaml задаёт THREADLINE_ALLOW_NO_LOGIN=1,
# без этой переменной сервер так не запустится. Вход через OIDC: config/README.md, «Вход и роли».
auth: off

defaults:
  project: pay
  environment: demo

backends:
  # Loki напрямую. Свой Loki: замените url, при нескольких арендаторах добавьте tenant (config/README.md, «Хранилище loki»).
  loki:
    type: loki
    url: http://loki:3100
    # Свой Loki рядом только для пробы: форма проекта может читать любой namespace.
    formScope:
      label: namespace
      values: ['*']

  # Loki через Grafana: docker compose --profile grafana up -d, затем токен сервисного аккаунта Grafana с ролью Viewer
  # в THREADLINE_GRAFANA_TOKEN (файл .env рядом с compose.yaml). Раскомментируйте блок и поставьте среде backend: grafana.
  # grafana:
  #   type: loki-grafana
  #   url: http://grafana:3000
  #   publicUrl: http://localhost:3000    # для ссылки «Открыть в Grafana»: с GRAFANA_PORT здесь тот же порт
  #   datasource: { name: Loki }
  #   tokenEnv: THREADLINE_GRAFANA_TOKEN

# Региональные правила демо-проекта, как в config/threadline.yaml: телефоны без кода страны и образцы документов.
regional:
  phone: { countryCode: '44', nationalDigits: 10, trunkPrefix: '0' }
  patterns:
    passport: ['[A-Z]{2}\d{7}']
    national_id: ['[A-Z]{2}\d{6}[A-D]']

projects:
  pay:
    name: Demo Pay
    logo:
      light: logos/demo-pay-light.png
      dark: logos/demo-pay-dark.png
    timezone: UTC
    format: json
    # Loki быстрого старта хранит записи 7 дней (loki.yaml, retention_period): столько же видит выбор периода.
    retentionDays: 7
    environments:
      # Записи пишет генератор demo-logs из compose.yaml: метки как у пода в Kubernetes, namespace pay.
      demo:
        name: Demo
        backend: loki
        selector:
          - { label: namespace, op: '=', value: pay }
        # Примеры поиска на стартовой странице: значения синтетического набора Demo Pay. Клиент, карта и телефон приходят в живом
        # потоке генератора раз в 3 минуты: за 6 ч, период по умолчанию, их 120, за сутки больше предела поиска в 200.
        # Выплата и запрос с отказом есть только в истории за сутки, которую генератор пишет при первом запуске: у них период 24 ч.
        # Подпись одной строкой видна на всех языках интерфейса; своя на каждом языке задаётся так: { ru: '…', en: '…' }.
        examples:
          - label: 'User: successful and failed requests'
            values: ['0192f0a1-7b2c-7d3e-8f40-5a6b7c8d9e0f']
          - label: 'Card: successful requests and a failure'
            values: ['4111111234557893']
          - label: 'Phone number in national format'
            values: ['07700 900001']
          - label: 'Transfer with a payout: every request of the operation'
            values: ['5b0e6c3a-2f4d-4a71-9c8e-1d2f3a4b5c6d']
            period: 24h
          - label: 'Request failed at the identity check'
            values: ['39e4b126-746e-4269-a4cd-65b766093c2a']
            period: 24h
