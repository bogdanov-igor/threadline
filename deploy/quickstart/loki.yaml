# Loki одним процессом для быстрого старта: данные в томе loki, без входа и арендаторов.
# Основа — конфигурация образа grafana/loki (cmd/loki/loki-docker-config.yaml), ниже пределы и срок хранения.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # В демо-наборе есть ответ страницей HTML на 300 КБ: по умолчанию предел строки 256 КБ.
  max_line_size: 512KB
  # История за сутки пишется при первом старте кусками по 1 МБ.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
