<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1092" width="1200" height="1092" role="img" aria-label="Как идёт поиск. Вы вставляете значение в браузере. Сервер Threadline превращает его в один шаблон на все написания, спрашивает у Loki, в каких запросах оно есть, считая по часам и не читая строк, затем читает все записи этих запросов, сшивает записи с одним correlation_id в запросы, добавляет названия и исходы из справочника и накладывает маски для вашей роли. Маскирование идёт на сервере: в браузер приходит только то, что можно этой роли, потоком шагов с отмеченным сломанным шагом.">
  <!-- the thread of one search: a value, two passes over Loki, masks, the flow -->
  <defs>
    <linearGradient id="fibre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f7ff"/>
      <stop offset="45%" stop-color="#cfe0ff"/>
      <stop offset="100%" stop-color="#86adff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4c8dff"/>
      <stop offset="55%" stop-color="#dfe6f5"/>
      <stop offset="100%" stop-color="#f5a65b"/>
    </linearGradient>
    <radialGradient id="halo" cx="15%" cy="12%" r="62%">
      <stop offset="0%" stop-color="#1f5fd6" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#0f2a5c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4c8dff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5b7fbf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#f5a65b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <radialGradient id="ember" gradientUnits="userSpaceOnUse" cx="172" cy="974" r="150"><stop offset="0%" stop-color="#f5a65b" stop-opacity="0.16"/><stop offset="100%" stop-color="#f5a65b" stop-opacity="0"/></radialGradient>
    <linearGradient id="thread" gradientUnits="userSpaceOnUse" x1="0" y1="268" x2="0" y2="946"><stop offset="0%" stop-color="#4c8dff"/><stop offset="50%" stop-color="#cfe0ff"/><stop offset="100%" stop-color="#4c8dff"/></linearGradient>
    <linearGradient id="toCause" gradientUnits="userSpaceOnUse" x1="0" y1="924" x2="0" y2="944"><stop offset="0%" stop-color="#4c8dff"/><stop offset="100%" stop-color="#f5a65b"/></linearGradient>
  </defs>
  <style>
    .sans, .h, .ct, .b, .s, .bl { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono, .k, .z, .m, .ms { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .k  { font-size: 16px; letter-spacing: 5px; fill: #7d889b; }
    .h  { font-size: 42px; font-weight: 800; letter-spacing: -1px; fill: url(#fibre); }
    .z  { font-size: 15.5px; letter-spacing: 3px; fill: #8592a8; }
    .ct { font-size: 21px; font-weight: 600; fill: #eef3fd; }
    .b  { font-size: 18px; fill: #a3afc3; }
    .s  { font-size: 16.5px; fill: #8592a8; }
    .bl { font-size: 18px; font-weight: 500; fill: #74a6ff; }
    .m  { font-size: 17px; fill: #c5d6f7; }
    .ms { font-size: 15.5px; fill: #a9bbdf; }
    .am { fill: #f5a65b; } .wh { fill: #eef3fd; } .mu { fill: #7d889b; } .bu { fill: #74a6ff; } .ok { fill: #7fd0a5; }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
    .card { fill: #0c111a; stroke: #1d2738; stroke-width: 1; }
    .zone { fill: #0a0f18; stroke: #1f3358; stroke-width: 1.25; }
    .hot  { fill: #0d182b; stroke: #3d6fc7; stroke-width: 1.5; }
    .cause { fill: #1a130c; stroke: #f5a65b; stroke-width: 1.5; }
    .chip { fill: #111b2c; stroke: #243553; stroke-width: 1; }
    .ghost { fill: none; stroke: #2a3a56; stroke-width: 1.25; stroke-dasharray: 5 5; }
    .wire { fill: none; stroke: #4c8dff; stroke-width: 2; }
    .wire2 { fill: none; stroke: #3a5a94; stroke-width: 1.75; }
    .dash { stroke-dasharray: 5 6; }
    .rule { stroke: #1d2738; stroke-width: 1; }
  </style>

  <rect width="1200" height="1092" rx="18" fill="#07090e"/>
  <rect width="1200" height="1092" rx="18" fill="url(#halo)"/>

  <!-- eyebrow, headline, accent -->
  <circle cx="48" cy="57" r="5" fill="#4c8dff"/><circle cx="48" cy="57" r="9.5" fill="none" stroke="#4c8dff" stroke-opacity="0.32" stroke-width="1"/>
  <text x="72" y="63" class="k">КАК ИДЁТ ПОИСК</text>
  <text x="38" y="121" class="h">Одно значение — и виден весь запрос</text>
  <rect x="40" y="140" width="232" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- zones: browser, server, Loki -->
  <text x="40" y="206" class="z">БРАУЗЕР</text>
  <rect x="352" y="170" width="500" height="886" rx="18" class="zone"/>
  <text x="376" y="206" class="z bu">СЕРВЕР THREADLINE</text>
  <text x="900" y="206" class="z">LOKI</text>
  <text x="900" y="240" class="s">Напрямую или через</text>
  <text x="900" y="264" class="s">Grafana, только чтение.</text>

  <!-- the trust boundary between the server and the browser -->
  <line x1="328" y1="170" x2="328" y2="1056" stroke="#4c8dff" stroke-opacity="0.55" stroke-width="1.75" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- browser: the value -->
  <rect x="40" y="234" width="264" height="168" rx="14" class="card"/>
  <text x="60" y="272" class="ct">Вставляете значение</text>
  <rect x="60" y="290" width="224" height="42" rx="9" class="chip"/>
  <text x="74" y="317" class="m wh">07700 900001</text>
  <text x="270" y="317" class="ms end mu">6 ч</text>
  <text x="60" y="360" class="b" style="font-size:17px">Уходит в теле запроса,</text>
  <text x="60" y="384" class="b" style="font-size:17px">в адресе его нет.</text>

  <!-- server: six steps on one thread -->
  <rect x="368" y="234" width="468" height="158" rx="14" class="card"/>
  <text x="436" y="275" class="ct">Все написания значения</text>
  <text x="436" y="303" class="b">Один шаблон, под который подходят все:</text>
  <rect x="368" y="408" width="468" height="110" rx="14" class="card"/>
  <text x="436" y="449" class="ct">Первый проход: какие запросы</text>
  <text x="436" y="477" class="b">Счёт по correlation_id, по часу, от новых</text>
  <text x="436" y="501" class="b">к старым. Больше 200 запросов — стоп.</text>
  <rect x="368" y="534" width="468" height="110" rx="14" class="card"/>
  <text x="436" y="575" class="ct">Второй проход: все их записи</text>
  <text x="436" y="603" class="b">По 50 запросов, только их часы</text>
  <text x="436" y="627" class="b">и по 5 минут с каждой стороны.</text>
  <rect x="368" y="660" width="468" height="110" rx="14" class="card"/>
  <text x="436" y="701" class="ct">Сшивка</text>
  <text x="436" y="729" class="b">Записи с одним correlation_id</text>
  <text x="436" y="753" class="b">становятся одним запросом.</text>
  <rect x="368" y="786" width="468" height="110" rx="14" class="card"/>
  <text x="436" y="827" class="ct">Названия и исходы</text>
  <text x="436" y="855" class="b">Справочник называет системы и ошибки,</text>
  <text x="436" y="879" class="b">определяет статус и причину.</text>
  <rect x="368" y="912" width="468" height="126" rx="14" class="hot"/>
  <text x="436" y="953" class="ct">Маски для этой роли</text>
  <text x="436" y="981" class="b">На сервере, до отправки ответа.</text>
  <rect x="436" y="316" width="196" height="27" rx="7" class="chip"/><text x="447" y="335" class="ms">+447700900001</text>
  <rect x="640" y="316" width="180" height="27" rx="7" class="chip"/><text x="651" y="335" class="ms">%2B447700900001</text>
  <rect x="436" y="350" width="196" height="27" rx="7" class="chip"/><text x="447" y="369" class="ms">+44 (7700) 900-001</text>
  <rect x="640" y="350" width="180" height="27" rx="7" class="chip"/><text x="651" y="369" class="ms">07700 900001</text>
  <rect x="436" y="996" width="160" height="27" rx="7" class="chip"/><text x="447" y="1015" class="ms">+447700900001</text>
  <path d="M 604 1009.5 H 644" class="wire" marker-end="url(#arrow)"/>
  <rect x="654" y="996" width="160" height="27" rx="7" class="chip"/><text x="665" y="1015" class="ms wh">+********0001</text>
  <path d="M 304 268 H 381" class="wire" marker-end="url(#arrow)"/>
  <path d="M 385 946 H 308" class="wire" marker-end="url(#arrow)"/>
  <line x1="400" y1="268" x2="400" y2="946" stroke="url(#thread)" stroke-width="2.5"/>
  <circle cx="400" cy="268" r="15" fill="#0b1628" stroke="#4c8dff" stroke-width="1.5"/><text x="400" y="273.5" class="ms mid wh" font-weight="600">1</text>
  <circle cx="400" cy="442" r="15" fill="#0b1628" stroke="#4c8dff" stroke-width="1.5"/><text x="400" y="447.5" class="ms mid wh" font-weight="600">2</text>
  <circle cx="400" cy="568" r="15" fill="#0b1628" stroke="#4c8dff" stroke-width="1.5"/><text x="400" y="573.5" class="ms mid wh" font-weight="600">3</text>
  <circle cx="400" cy="694" r="15" fill="#0b1628" stroke="#4c8dff" stroke-width="1.5"/><text x="400" y="699.5" class="ms mid wh" font-weight="600">4</text>
  <circle cx="400" cy="820" r="15" fill="#0b1628" stroke="#4c8dff" stroke-width="1.5"/><text x="400" y="825.5" class="ms mid wh" font-weight="600">5</text>
  <circle cx="400" cy="946" r="15" fill="#0b1628" stroke="#4c8dff" stroke-width="1.5"/><text x="400" y="951.5" class="ms mid wh" font-weight="600">6</text>

  <!-- Loki: counts, then records -->
  <rect x="900" y="346" width="260" height="214" rx="14" class="card"/>
  <text x="924" y="384" class="ct">Подсчёт</text>
  <text x="924" y="411" class="b" style="font-size:17px">Приходят числа,</text>
  <text x="924" y="435" class="b" style="font-size:17px">ни одной строки.</text>
  <rect x="924" y="492" width="28" height="32" rx="3" fill="#4c8dff" fill-opacity="0.73"/><text x="938" y="486" class="ms mid">3</text>
  <rect x="960" y="476" width="28" height="48" rx="3" fill="#4c8dff" fill-opacity="0.95"/><text x="974" y="470" class="ms mid">5</text>
  <rect x="996" y="508" width="28" height="16" rx="3" fill="#4c8dff" fill-opacity="0.51"/><text x="1010" y="502" class="ms mid">1</text>
  <rect x="1032" y="516" width="28" height="8" rx="3" fill="#24324c" fill-opacity="1"/><text x="1046" y="510" class="ms mid">0</text>
  <rect x="1068" y="500" width="28" height="24" rx="3" fill="#4c8dff" fill-opacity="0.62"/><text x="1082" y="494" class="ms mid">2</text>
  <rect x="1104" y="508" width="28" height="16" rx="3" fill="#4c8dff" fill-opacity="0.51"/><text x="1118" y="502" class="ms mid">1</text>
  <text x="924" y="546" class="s">сейчас</text>
  <text x="1132" y="546" class="s end">6 ч назад</text>
  <rect x="900" y="582" width="260" height="186" rx="14" class="card"/>
  <text x="924" y="620" class="ct">Чтение</text>
  <text x="924" y="647" class="b" style="font-size:17px">Все записи запросов, даже</text>
  <text x="924" y="671" class="b" style="font-size:17px">те, где значения нет.</text>
  <rect x="924" y="694" width="34" height="9" rx="4.5" fill="#22304a"/><rect x="966" y="694" width="52" height="9" rx="4.5" fill="#4c8dff"/><rect x="1026" y="694" width="90" height="9" rx="4.5" fill="#22304a"/>
  <rect x="924" y="714" width="62" height="9" rx="4.5" fill="#22304a"/><rect x="994" y="714" width="52" height="9" rx="4.5" fill="#4c8dff"/><rect x="1054" y="714" width="60" height="9" rx="4.5" fill="#22304a"/>
  <rect x="924" y="734" width="22" height="9" rx="4.5" fill="#22304a"/><rect x="954" y="734" width="52" height="9" rx="4.5" fill="#4c8dff"/><rect x="1014" y="734" width="112" height="9" rx="4.5" fill="#22304a"/>
  <rect x="900" y="790" width="260" height="164" rx="14" class="ghost"/>
  <text x="924" y="826" class="bl">Бережно</text>
  <text x="924" y="854" class="s">До 4 запросов сразу.</text>
  <text x="924" y="878" class="s">Одинаковые — один раз.</text>
  <text x="924" y="902" class="s">Закрытая вкладка</text>
  <text x="924" y="926" class="s">останавливает поиск.</text>
  <path d="M 836 463 H 896" class="wire" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M 836 612 H 896" class="wire" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- browser: the flow, the failed step in amber -->
  <rect x="40" y="742" width="264" height="296" rx="14" class="card"/>
  <rect x="41" y="743" width="262" height="294" rx="13" fill="url(#ember)"/>
  <text x="60" y="780" class="ct">Видите поток</text>
  <line x1="80" y1="852" x2="80" y2="872" stroke="#4c8dff" stroke-width="2"/>
  <line x1="80" y1="924" x2="80" y2="944" stroke="url(#toCause)" stroke-width="2"/>
  <rect x="60" y="800" width="224" height="52" rx="10" class="chip"/><circle cx="80" cy="826" r="4.5" fill="#7fd0a5"/>
  <text x="96" y="832" class="b wh" style="font-size:17px">Шлюз</text>
  <text x="270" y="832" class="ms end mu">12 мс</text>
  <rect x="60" y="872" width="224" height="52" rx="10" class="chip"/><circle cx="80" cy="898" r="4.5" fill="#7fd0a5"/>
  <text x="96" y="904" class="b wh" style="font-size:17px">API платежей</text>
  <text x="270" y="904" class="ms end mu">41 мс</text>
  <rect x="60" y="944" width="224" height="52" rx="10" class="cause"/><circle cx="80" cy="970" r="4.5" fill="#f5a65b"/>
  <text x="96" y="976" class="b wh" style="font-size:17px">Антифрод</text>
  <text x="270" y="976" class="ms end am">тайм-аут</text>
  <text x="282" y="1021" class="s end am">причина</text>

  <!-- the boundary names itself: a lock and one sentence -->
  <path d="M 163 505 v -7 a 9 9 0 0 1 18 0 v 7" fill="none" stroke="#74a6ff" stroke-width="2.25"/>
  <rect x="157" y="505" width="30" height="23" rx="5" fill="#0d182b" stroke="#74a6ff" stroke-width="2"/>
  <circle cx="172" cy="516.5" r="2.75" fill="#74a6ff"/>
  <text x="172" y="563" class="bl mid">Через эту линию — только то,</text>
  <text x="172" y="588" class="bl mid">что можно этой роли</text>
  <path d="M 198 516 H 322" class="wire2 dash" marker-end="url(#arrow2)"/>
</svg>
